services:
  backend:
    build: ./backend
    container_name: api-docs-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-secret-key}
      - NODE_ENV=production
    volumes:
      - ./backend/data:/app/data
    networks:
      - api-docs-net

  frontend:
    build: ./frontend
    container_name: api-docs-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - api-docs-net

networks:
  api-docs-net:
    driver: bridge
